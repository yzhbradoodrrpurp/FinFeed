<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>登录 · FinFeed</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/auth-client.js" defer></script><script src="/login.js" defer></script><script src="/bridge.js" defer></script>
</head><body class="login-page">
  <header class="masthead"><a class="brand" href="/"><span class="brand-icon">F</span>FinFeed</a></header>
  <main class="login-main"><section class="login-card">
    <div class="eyebrow">YOUR MARKET DASHBOARD</div><h1>你的市场。</h1>
    <p><a id="signup-link" href="/login?register=1">首次使用？通过邀请码创建账户</a></p>
    <p id="login-description">使用 Passkey 验证身份，查看你的关注列表和持仓。</p>
    <form id="passkey-form">
      <div id="setup-fields" hidden>
        <label for="setup-code">首次绑定码</label>
        <input id="setup-code" type="password" autocomplete="off" spellcheck="false" placeholder="输入你的私密绑定码">
        <p class="login-hint">仅在首次绑定时使用。仅用于原始账户首次绑定。</p>
      </div>
      <div id="signup-fields" hidden><label for="invite-code">邀请码</label><input id="invite-code" maxlength="100" autocomplete="off" spellcheck="false" placeholder="输入收到的邀请码"><label for="account-name">账户名称</label><input id="account-name" maxlength="40" autocomplete="nickname" placeholder="如 Liam"><p class="login-hint">账户名称创建后不可修改。</p><p class="login-hint">登录用户可查看你的关注列表、持仓数量、成本和盈亏；只有你可以修改。</p></div>
      <button id="passkey-submit" class="primary" type="submit" disabled>正在连接…</button>
    </form>
    <p id="login-error" class="feedback" role="alert" hidden></p>
    <p class="login-hint">通过设备指纹、面容或系统解锁验证。</p>
</section></main>
</body></html>
