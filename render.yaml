services:
  - type: web
    name: finfeed-private
    runtime: python
    plan: free
    rootDir: dashboard
    buildCommand: python build_cloud.py
    startCommand: python start_cloud.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: DATABASE_URL
        sync: false
      - key: FINFEED_BOOTSTRAP_TOKEN
        sync: false
